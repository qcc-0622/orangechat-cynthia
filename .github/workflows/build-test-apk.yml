name: Build Test APK

on:
  workflow_dispatch:
  push:
    branches:
      - 'fix/**'
      - 'ci/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # material3 模块把 submodule 的源码加进 sourceSet, 缺了会编译失败。
      # 只初始化这一个: mnn 用的是 SSH 地址, 且 ai 模块的 CMake 已注释掉, 构建不需要它。
      - name: Init submodule
        run: git submodule update --init material3/material-color-utilities

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: web-ui/pnpm-lock.yaml

      # :web:preBuild 依赖 buildWebUi (即 web-ui 的 pnpm run build), 必须先装依赖
      - name: Install web-ui deps
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      # debug 变体固定读项目内置的 app/debug.keystore, 但 *.keystore 被 .gitignore 排除,
      # 仓库里没有这个文件 (本地构建有, 所以本地不报错), CI 里不补上就会:app:validateSigningDebug 失败。
      # 用 cache 保存生成的那一份, 保证各次 CI 构建签名一致, 避免互相覆盖安装时报 -99。
      - name: Restore CI debug keystore
        uses: actions/cache@v4
        with:
          path: app/debug.keystore
          key: ci-debug-keystore-v1

      - name: Ensure debug keystore
        run: |
          if [ ! -f app/debug.keystore ]; then
            echo "app/debug.keystore 不存在, 生成 CI 专用 debug keystore"
            keytool -genkeypair -v \
              -keystore app/debug.keystore \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          else
            echo "复用 cache 中的 app/debug.keystore"
          fi

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Gradle Build (debug)
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: apk-debug
          path: app/build/outputs/apk/debug/*.apk
